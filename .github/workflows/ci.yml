name: Verify NEON CASINO
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: neon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://neon:ci-only-password@localhost:5432/neon_test
      TEST_DATABASE_URL: postgresql://neon:ci-only-password@localhost:5432/neon_test
      APP_URL: http://localhost:3000
      IP_HASH_SECRET: ci-fixture-only-not-a-production-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - name: Browser smoke test
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm start > /tmp/neon-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Crash interaction regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/interaction-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
