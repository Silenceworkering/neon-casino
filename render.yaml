services:
  - type: web
    name: neon-casino
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
